spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.driver.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop  # 테스트 시작 시 테이블 자동 생성, 종료 시 삭제
    show-sql: true          # 콘솔에 쿼리 출력
    properties:
      hibernate:
        format_sql: true    # 쿼리 예쁘게 출력