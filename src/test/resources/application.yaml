spring:
  datasource:
    url: jdbc:mysql://localhost:3306/stock_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: create-drop  # 테스트 시작 시 테이블 자동 생성, 종료 시 삭제
    show-sql: true          # 콘솔에 쿼리 출력
    properties:
      hibernate:
        format_sql: true    # 쿼리 예쁘게 출력